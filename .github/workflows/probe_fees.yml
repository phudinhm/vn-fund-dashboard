name: Probe fmarket fees (temporary)
on:
  push:
    paths:
      - '.github/workflows/probe_fees.yml'
      - 'scripts/probe_fees.mjs'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/probe_fees.mjs
