name: Backfill Fund Reports

# One-off / occasional job (workflow_dispatch only, not scheduled): downloads a
# fund's monthly financial reports from dragoncapital.com.vn, converts them to
# the tidied CSVs the "Fund Analysis" tab reads, and regenerates holdings for
# the Overlap tab. See scripts/fund_report/README.md for the full pipeline.
on:
  workflow_dispatch:
    inputs:
      fund:
        description: 'Fund id (e.g. DCBF)'
        required: true
      url:
        description: 'Dragon Capital product page URL (…/product/<id>/<slug>)'
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install playwright requests pandas openpyxl

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Download reports for ${{ inputs.fund }}
        run: python -X utf8 scripts/fund_report/download_dragoncapital_reports.py --fund "${{ inputs.fund }}" --url "${{ inputs.url }}"

      - name: Convert xlsx to tidied CSVs
        run: python -X utf8 scripts/fund_report/fund_reports_update.py

      - name: Regenerate holdings (Overlap tab)
        run: python -X utf8 scripts/fund_report/fund_reports_to_holdings.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Backfill fund report data for ${{ inputs.fund }}"
          git push
