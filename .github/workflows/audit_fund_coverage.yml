name: Audit Fund Coverage and Profiles

# Chạy tay khi cần soát danh mục, thêm hàng tháng để quỹ mới không bị bỏ quên
# nhiều tháng liền. Không chạy hàng ngày: danh mục quỹ mở thay đổi rất chậm.
on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Ghi quỹ thiếu vào metadata và mở PR'
        type: boolean
        default: true
  schedule:
    - cron: '0 12 1 * *' # 12:00 UTC ngày 1 hàng tháng

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Cùng lý do như update_daily.yml: ghi rõ nhánh đích thay vì để nhánh
      # mặc định của repo quyết định.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit coverage
        id: audit
        run: |
          node scripts/audit_fund_coverage.mjs | tee /tmp/audit.txt
          if [ "${{ inputs.write }}" = "false" ]; then
            echo "Chỉ báo cáo, không ghi."
            exit 0
          fi
          node scripts/audit_fund_coverage.mjs --write

      # Hồ sơ quỹ (phí, công ty quản lý, ngày thành lập) đổi rất chậm nên đi
      # cùng nhịp soát danh mục, không cần chạy hàng ngày.
      - name: Refresh fund and fund-house profiles
        run: node scripts/fetch_fund_profiles.mjs

      # Đẩy nhánh rồi in link tạo PR, KHÔNG gọi `gh pr create`: repo này tắt
      # quyền "Allow GitHub Actions to create and approve pull requests", nên
      # lần chạy đầu tiên đã đỏ ở đúng bước đó dù dữ liệu đã lấy xong. Đẩy nhánh
      # là phần việc thật; mở PR chỉ là một cú bấm.
      - name: Push a branch when the catalogue or profiles changed
        run: |
          if git diff --quiet -- public/data; then
            echo "Không có thay đổi nào về danh mục hay hồ sơ."
            exit 0
          fi
          branch="fund-coverage/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/fund_metadata.json public/data/fund_profiles.json public/data/fund_houses.json
          git commit -m "Cập nhật danh mục quỹ và hồ sơ quỹ theo fmarket"
          git push -u origin "$branch"
          {
            echo "### Đã đẩy nhánh \`$branch\`"
            echo ""
            echo "[Mở pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...$branch?expand=1)"
            echo ""
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
